name: Release Automation

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-automation
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: "Type of release"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Git User Info
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      # Update release draft first. Release Drafter is the sole authority for the
      # resolved version, tag, release name, and release-note body.
      - name: Update Release Draft
        uses: release-drafter/release-drafter@v7
        id: release_drafter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Generate CHANGELOG.md from the same Release Drafter outputs used for the
      # draft/published GitHub Release. This prevents independent version bumps
      # from drifting away from the actual release tag.
      - name: Generate Changelog From Release Draft
        id: changelog
        env:
          RELEASE_TAG: ${{ steps.release_drafter.outputs.tag_name }}
          RELEASE_BODY: ${{ steps.release_drafter.outputs.body }}
        run: |
          set -euo pipefail

          if [ -z "${RELEASE_TAG}" ]; then
            echo "::error::Release Drafter did not return a tag_name output."
            exit 1
          fi

          if [ -z "${RELEASE_BODY}" ]; then
            echo "::error::Release Drafter did not return a body output."
            exit 1
          fi

          previous_tag=$(git tag --sort=-v:refname | grep -vx "${RELEASE_TAG}" | head -n 1 || true)
          known_tags=$(git tag | tr '\n' ' ')
          release_date=$(date -u +%Y-%m-%d)

          PREVIOUS_TAG="${previous_tag}" KNOWN_TAGS="${known_tags}" RELEASE_DATE="${release_date}" python3 <<'PY'
          import os
          import re
          from pathlib import Path

          changelog_path = Path("CHANGELOG.md")
          release_tag = os.environ["RELEASE_TAG"].strip()
          release_body = os.environ["RELEASE_BODY"].strip()
          release_date = os.environ["RELEASE_DATE"].strip()
          repository = os.environ["GITHUB_REPOSITORY"]
          previous_tag = os.environ.get("PREVIOUS_TAG", "").strip()
          known_tags = set(os.environ.get("KNOWN_TAGS", "").split())

          full_changelog_match = re.search(
              r"\*\*Full Changelog\*\*:\s+(https://github\.com/[^\s]+/compare/.+?\.\.\.[^\s]+)",
              release_body,
          )
          if full_changelog_match:
              compare_url = full_changelog_match.group(1)
          elif previous_tag:
              compare_url = f"https://github.com/{repository}/compare/{previous_tag}...{release_tag}"
          else:
              compare_url = f"https://github.com/{repository}/releases/tag/{release_tag}"

          new_entry = f"# [{release_tag}]({compare_url}) ({release_date})\n\n{release_body}\n"

          existing = changelog_path.read_text(encoding="utf-8") if changelog_path.exists() else ""
          release_header = re.compile(r"(?m)^#{1,2} \[(\d+\.\d+\.\d+(?:[-+][^\]]+)?)\]\(")
          matches = list(release_header.finditer(existing))

          if not matches:
              updated = f"{new_entry}\n{existing.lstrip()}" if existing else f"{new_entry}\n"
          else:
              first_header = matches[0]
              first_version = first_header.group(1)
              second_start = matches[1].start() if len(matches) > 1 else len(existing)

              if first_version == release_tag or first_version not in known_tags:
                  # Replace the current generated top entry when it already
                  # targets this release, or when a previous automation run
                  # produced an untagged divergent version.
                  updated = existing[: first_header.start()] + new_entry + "\n" + existing[second_start:].lstrip("\n")
              else:
                  updated = f"{new_entry}\n{existing.lstrip()}"

          changelog_path.write_text(updated.rstrip() + "\n", encoding="utf-8")
          PY

          if git diff --quiet -- CHANGELOG.md; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      # Open a PR with the updated CHANGELOG.md (respects branch ruleset)
      - name: Create Changelog PR
        if: steps.changelog.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: CHANGELOG.md
          commit-message: "docs: update changelog for ${{ steps.release_drafter.outputs.tag_name }}"
          title: "docs: update changelog for ${{ steps.release_drafter.outputs.tag_name }}"
          branch: auto/changelog-update
          base: main
          body: |
            Automated changelog update generated by Release Automation workflow.

            **Version**: `${{ steps.release_drafter.outputs.tag_name }}`
            **Source**: Release Drafter `${{ steps.release_drafter.outputs.id }}`
          labels: docs

      # Show release information
      - name: Show Release Information
        run: |
          echo "🏷️ Tag Name: ${{ steps.release_drafter.outputs.tag_name }}"
          echo "📝 Release Name: ${{ steps.release_drafter.outputs.name }}"
          echo "🔢 Version: ${{ steps.release_drafter.outputs.resolved_version || steps.release_drafter.outputs.tag_name }}"
          echo "📄 Changelog Changed: ${{ steps.changelog.outputs.changed }}"
          echo "🆔 Release ID: ${{ steps.release_drafter.outputs.id || 'N/A' }}"

      - name: Stop Manual Release Until Changelog PR Is Merged
        if: github.event_name == 'workflow_dispatch' && steps.changelog.outputs.changed == 'true'
        run: |
          echo "::error::CHANGELOG.md was updated from the Release Drafter output. Merge the generated changelog PR, then re-run the manual release workflow."
          exit 1

      # Manual release creation (workflow_dispatch)
      - name: Create Release (Manual)
        if: github.event_name == 'workflow_dispatch' && steps.changelog.outputs.changed == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_drafter.outputs.tag_name }}
          name: ${{ steps.release_drafter.outputs.name }}
          body: ${{ steps.release_drafter.outputs.body }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
